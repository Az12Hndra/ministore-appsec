services:
  db:
    image: postgres:16-alpine
    container_name: ministore_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ministore_user
      POSTGRES_PASSWORD: localdevpassword
      POSTGRES_DB: ministore
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
